<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bw-bg" x1="40" y1="24" x2="472" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5C8A"/>
      <stop offset="52%" stop-color="#FF7A59"/>
      <stop offset="100%" stop-color="#FF9F43"/>
    </linearGradient>
    <radialGradient id="bw-glow" cx="256" cy="150" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF7D6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFF7D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bw-tier-top" x1="140" y1="220" x2="372" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#FFE8F0"/>
    </linearGradient>
    <linearGradient id="bw-tier-bot" x1="104" y1="300" x2="408" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#5B3DF5"/>
    </linearGradient>
    <linearGradient id="bw-flame" x1="256" y1="68" x2="256" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF6B3"/>
      <stop offset="45%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#FF6B2B"/>
    </linearGradient>
    <filter id="bw-shadow" x="60" y="70" width="392" height="390" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#6B1035" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Squircle badge -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bw-bg)"/>
  <circle cx="256" cy="150" r="150" fill="url(#bw-glow)"/>
  <rect x="22" y="22" width="468" height="468" rx="110" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"/>

  <!-- Confetti dots & ribbons -->
  <circle cx="96" cy="126" r="11" fill="#FFD93D"/>
  <circle cx="418" cy="134" r="10" fill="#2ED8B6"/>
  <rect x="78" y="218" width="22" height="10" rx="5" transform="rotate(-28 78 218)" fill="#2ED8B6"/>
  <rect x="404" y="214" width="22" height="10" rx="5" transform="rotate(24 404 214)" fill="#FFD93D"/>
  <circle cx="104" cy="300" r="8" fill="#FFFDF9" fill-opacity="0.85"/>
  <circle cx="414" cy="296" r="9" fill="#FFFDF9" fill-opacity="0.85"/>

  <g filter="url(#bw-shadow)">
    <!-- 3 Candles -->
    <!-- Left candle -->
    <rect x="172" y="148" width="28" height="78" rx="10" fill="#2ED8B6"/>
    <path d="M172 170 H200 M172 192 H200" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.65"/>
    <path d="M186 88 C170 112, 171 134, 186 142 C201 134, 202 112, 186 88 Z" fill="url(#bw-flame)"/>
    <circle cx="186" cy="124" r="7" fill="#FFFDF9"/>

    <!-- Center candle (taller) -->
    <rect x="242" y="132" width="28" height="94" rx="10" fill="#FFD93D"/>
    <path d="M242 156 H270 M242 180 H270 M242 202 H270" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.7"/>
    <path d="M256 66 C238 94, 239 118, 256 127 C273 118, 274 94, 256 66 Z" fill="url(#bw-flame)"/>
    <circle cx="256" cy="108" r="8" fill="#FFFDF9"/>

    <!-- Right candle -->
    <rect x="312" y="148" width="28" height="78" rx="10" fill="#7C5CFF"/>
    <path d="M312 170 H340 M312 192 H340" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.65"/>
    <path d="M326 88 C310 112, 311 134, 326 142 C341 134, 342 112, 326 88 Z" fill="url(#bw-flame)"/>
    <circle cx="326" cy="124" r="7" fill="#FFFDF9"/>

    <!-- Upper cake tier -->
    <rect x="136" y="216" width="240" height="96" rx="26" fill="url(#bw-tier-top)"/>
    <!-- Pink berry frosting wave on upper tier -->
    <path d="M136 242 C156 262, 176 262, 196 242 C216 262, 236 262, 256 242 C276 262, 296 262, 316 242 C336 262, 356 262, 376 242 L376 236 C376 225, 367 216, 356 216 L156 216 C145 216, 136 225, 136 236 Z" fill="#FF3E78"/>
    <!-- Sprinkles on upper tier -->
    <circle cx="178" cy="282" r="7" fill="#FF5C8A"/>
    <circle cx="230" cy="276" r="7" fill="#2ED8B6"/>
    <circle cx="284" cy="284" r="7" fill="#FF9F43"/>
    <circle cx="334" cy="276" r="7" fill="#7C5CFF"/>

    <!-- Lower cake tier -->
    <rect x="104" y="300" width="304" height="114" rx="30" fill="url(#bw-tier-bot)"/>
    <!-- Creamy white icing drips on lower tier -->
    <path d="M104 330 C104 313, 117 300, 134 300 L378 300 C395 300, 408 313, 408 330 L408 338 C392 338, 388 358, 372 358 C356 358, 352 334, 336 334 C320 334, 316 364, 298 364 C280 364, 276 336, 256 336 C236 336, 232 362, 214 362 C196 362, 192 334, 176 334 C160 334, 156 356, 140 356 C124 356, 120 338, 104 338 Z" fill="#FFFDF9"/>

    <!-- Golden ribbon bow / dots on lower tier -->
    <circle cx="156" cy="382" r="9" fill="#FFD93D"/>
    <circle cx="206" cy="390" r="8" fill="#2ED8B6"/>
    <circle cx="256" cy="382" r="10" fill="#FFD93D"/>
    <circle cx="306" cy="390" r="8" fill="#FF9F43"/>
    <circle cx="356" cy="382" r="9" fill="#FFD93D"/>

    <!-- Cake plate -->
    <rect x="82" y="408" width="348" height="24" rx="12" fill="#FFFDF9"/>
  </g>
</svg>
